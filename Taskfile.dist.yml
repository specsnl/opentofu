version: "3"

silent: true

vars:
  DOCKER_REPO: ghcr.io
  DOCKER_OWNER: specsnl
  DOCKER_IMAGE_NAME: opentofu
  # Latest version of Hadolint: https://hub.docker.com/r/hadolint/hadolint/tags or https://github.com/hadolint/hadolint/releases
  HADOLINT_TAG_VERSION: v2.15.1

tasks:

  build:
    desc: Build the OpenTofu and upctl images
    deps: [lint]
    cmds:
      - docker build
        --target base
        --tag {{.DOCKER_REPO}}/{{.DOCKER_OWNER}}/{{.DOCKER_IMAGE_NAME}}:latest
        .
      - docker build
        --target upctl
        --tag {{.DOCKER_REPO}}/{{.DOCKER_OWNER}}/{{.DOCKER_IMAGE_NAME}}/upctl:latest
        .

  check-updates:
    desc: Check for newer versions of the pinned tools
    cmds:
      - |
        status=0
        for check in scripts/check-*-version.sh; do
          "$check" || status=$(( $? > status ? $? : status ))
        done
        exit $status

  lint:
    desc: Apply a Dockerfile linter (https://github.com/hadolint/hadolint)
    cmds:
      - docker run
        --interactive
        --rm
        hadolint/hadolint:{{.HADOLINT_TAG_VERSION}}
        hadolint
        -
        < Dockerfile

  shell:
    desc: Interactive shell
    interactive: true
    cmds:
      - docker run
        --interactive
        --tty
        --rm
        --entrypoint=/bin/bash
        {{.DOCKER_REPO}}/{{.DOCKER_OWNER}}/{{.DOCKER_IMAGE_NAME}}:latest

  shell:upctl:
    desc: Interactive shell in the upctl image
    interactive: true
    cmds:
      - docker run
        --interactive
        --tty
        --rm
        --entrypoint=/bin/bash
        {{.DOCKER_REPO}}/{{.DOCKER_OWNER}}/{{.DOCKER_IMAGE_NAME}}/upctl:latest
